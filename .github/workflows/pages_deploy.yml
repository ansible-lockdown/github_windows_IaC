# .github/workflows/pages_deploy.yml
# ----------------------------------------------------------
# Publishes the FULL site (repo root) to GitHub Pages
# on an ~70-minute cadence using plain cron.
#
# Notes:
# - These cron lines approximate 70m by running at:
#   00:00, 01:10, 02:20, 03:30, 04:40, 05:50,
#   07:00, 08:10, 09:20, 10:30, 11:40, 12:50,
#   14:00, 15:10, 16:20, 17:30, 18:40, 19:50,
#   21:00, 22:10, 23:20, then wraps to 00:00 (≈40m gap).
# - Publishes from repo ROOT, preserving the entire site.
# - `.nojekyll` ensures JSON in /badges/ is served as-is.
# - No preflight, no extra logic — just the deploy.
# ----------------------------------------------------------

name: Pages Deploy (~70m cadence)

on:
  schedule:
    - cron: "0 0,7,14,21 * * *"   # 00:00, 07:00, 14:00, 21:00
    - cron: "10 1,8,15,22 * * *"  # 01:10, 08:10, 15:10, 22:10
    - cron: "20 2,9,16,23 * * *"  # 02:20, 09:20, 16:20, 23:20
    - cron: "30 3,10,17 * * *"    # 03:30, 10:30, 17:30
    - cron: "40 4,11,18 * * *"    # 04:40, 11:40, 18:40
    - cron: "50 5,12,19 * * *"    # 05:50, 12:50, 19:50
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy full site (root)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    # Let a deploy finish once it starts; no cancellation.
    concurrency:
      group: pages-deploy-live
      cancel-in-progress: false

    steps:
      - name: Checkout site (self_hosted)
        uses: actions/checkout@v4
        with:
          ref: self_hosted

      - name: Ensure no Jekyll processing (serve JSON/raw)
        run: touch .nojekyll

      - name: Upload Pages artifact (root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
