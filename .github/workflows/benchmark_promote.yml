name: Benchmark Promotion Job

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true
      BADGE_PUSH_TOKEN:
        required: true

jobs:
  monitor-90day-promotions:
    name: Monitor & Auto-Promote Benchmarks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      repo: ${{ inputs.repo_name }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      BADGE_PUSH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "TEAMS_WEBHOOK_URL is not set."
            exit 1
          fi
          if [ -z "${{ secrets.BADGE_PUSH_TOKEN }}" ]; then
            echo "BADGE_PUSH_TOKEN is not set."
            exit 1
          fi

      - name: Validate calling repository is Private
        if: ${{ !startsWith(inputs.repo_name, 'ansible-lockdown/Private-') }}
        run: |
          echo "This workflow must be called by ansible-lockdown/Private-* repos."
          exit 1

      - name: Extract short repo name and public repo equivalent
        id: names
        run: |
          repo_full="${{ inputs.repo_name }}"
          repo_short=$(basename "$repo_full")
          public_name=$(echo "$repo_short" | sed 's/^Private-//')
          echo "repo_short=$repo_short" >> $GITHUB_OUTPUT
          echo "public_repo=ansible-lockdown/$public_name" >> $GITHUB_OUTPUT

      - name: Set PRIVATE_REPOS env
        run: |
          echo "PRIVATE_REPOS=${{ inputs.repo_name }}" >> $GITHUB_ENV

      - name: Install GitHub CLI and tools
        run: |
          sudo apt-get update && sudo apt-get install -y gh jq rsync

      - name: Extract issue and version metadata
        run: |
          mkdir -p issue_data

          for repo in $PRIVATE_REPOS; do
            echo "Checking issues in $repo"
            gh issue list -R $repo --label benchmark-3day --state open --json title,number,createdAt --jq '.[]' > issues.json

            jq -c '.' issues.json | while read -r issue; do
              title=$(echo "$issue" | jq -r '.title')
              number=$(echo "$issue" | jq -r '.number')
              created_at=$(echo "$issue" | jq -r '.createdAt')
              age_days=$(( ( $(date +%s) - $(date -d "$created_at" +%s) ) / 86400 ))

              repo_short=$(echo "$repo" | sed 's/^ansible-lockdown\/Private-//')
              public_repo="ansible-lockdown/$repo_short"

              rm -rf tmpclone && mkdir -p tmpclone && cd tmpclone

              echo "Cloning latest branch of $repo to extract version..."
              git clone --depth 1 --branch latest https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/${{ inputs.repo_name }}.git private || { echo "Failed to clone private repo"; cd ..; rm -rf tmpclone; continue; }
              priv_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' private/README.md | head -n1)
              [ -z "$priv_ver" ] && priv_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' private/README.md | head -n1)

              echo "Extracted version: $priv_ver"
              echo "priv_ver=$priv_ver" >> $GITHUB_ENV
              echo "priv_ver=$priv_ver" >> $GITHUB_OUTPUT

              if [ -z "$priv_ver" ]; then
                echo "[WARN] No version found in private repo $repo. Skipping issue #$number."
                cd .. && rm -rf tmpclone
                continue
              fi

              echo "Cloning devel branch of $public_repo to extract version..."
              git clone --depth 1 --branch devel https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/$public_repo.git public || echo "[WARN] Public repo $public_repo is missing"
              pub_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' public/README.md | head -n1)
              [ -z "$pub_ver" ] && pub_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' public/README.md | head -n1)

              echo "Extracted public version: $pub_ver"
              echo "pub_ver=$pub_ver" >> $GITHUB_ENV
              echo "pub_ver=$pub_ver" >> $GITHUB_OUTPUT

              cd .. && rm -rf tmpclone

              echo "{
                \"repo\": \"$repo\",
                \"number\": \"$number\",
                \"title\": \"$title\",
                \"created_at\": \"$created_at\",
                \"age_days\": \"$age_days\",
                \"priv_ver\": \"$priv_ver\",
                \"pub_ver\": \"$pub_ver\",
                \"public_repo\": \"$public_repo\"
              }" > issue_data/${repo//\//_}__$number.json
            done
          done

      - name: Close already promoted issues and notify Teams
        run: |
          for issue_file in issue_data/*.json; do
            repo=$(jq -r '.repo' "$issue_file")
            number=$(jq -r '.number' "$issue_file")
            priv_ver=$(jq -r '.priv_ver' "$issue_file")
            pub_ver=$(jq -r '.pub_ver' "$issue_file")
            public_repo=$(jq -r '.public_repo' "$issue_file")

            if [ "$priv_ver" = "$pub_ver" ]; then
              echo "[INFO] Benchmark version $priv_ver already promoted. Closing issue #$number in $repo."
              gh issue close "$number" -R "$repo" --comment "Benchmark version $priv_ver has been promoted to public. Closing tracker."

          cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-
          {
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "color": "Good",
                      "text": "✅ Benchmark Already Promoted"
                    },
                    {
                      "type": "TextBlock",
                      "text": "Benchmark version ${priv_ver} from **${repo}** is already available in **${public_repo}**.",
                      "wrap": true,
                      "spacing": "Medium"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "🔒 Private Repo:", "value": "${repo}" },
                        { "title": "📦 Private Version:", "value": "${priv_ver}" },
                        { "title": "🌐 Public Repo:", "value": "${public_repo}" },
                        { "title": "📦 Public Version:", "value": "${pub_ver}" }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "🔗 [View Issue #${number}](https://github.com/${repo}/issues/${number})",
                      "wrap": true,
                      "spacing": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "📅 Auto-closed on: $(date -u +%Y-%m-%dT%H:%M:%SZ)",
                      "wrap": true,
                      "spacing": "Small"
                    }
                  ]
                }
              }
            ]
          }
          EOF
            fi
          done

      - name: Send reminder messages for promotion windows (day 2–4)
        run: |
          for issue_file in issue_data/*.json; do
            repo=$(jq -r '.repo' "$issue_file")
            number=$(jq -r '.number' "$issue_file")
            priv_ver=$(jq -r '.priv_ver' "$issue_file")
            pub_ver=$(jq -r '.pub_ver' "$issue_file")
            age_days=$(jq -r '.age_days' "$issue_file")
            public_repo=$(jq -r '.public_repo' "$issue_file")

            if [ "$priv_ver" = "$pub_ver" ]; then
              continue
            fi

            if [ "$age_days" -ge 2 ] && [ "$age_days" -lt 5 ]; then
              if [ "$age_days" -eq 3 ]; then
                reminder_msg="🚨 **Benchmark $priv_ver** from \`$repo\` is due for public release **today** (day 3)."
                urgency_note="⌛ Please review and promote if everything is ready."
              elif [ "$age_days" -lt 3 ]; then
                days_left=$((3 - age_days))
                reminder_msg="⏳ **Benchmark $priv_ver** from \`$repo\` is due for public release in **$days_left day(s)**."
                urgency_note="🎯 Target date is day 3. Prepare for promotion."
              else
                overdue_days=$((age_days - 3))
                merge_in_days=$((5 - age_days))
                reminder_msg="⚠️ **Benchmark $priv_ver** from \`$repo\` is **overdue by $overdue_days day(s)**."
                urgency_note="⏲️ Auto-promotion will occur in **$merge_in_days day(s)** (day 5)."
              fi

              issue_url="https://github.com/ansible-lockdown/$repo/issues/$number"
              echo "Sending Teams reminder for issue #$number"

          cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-
          {
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "color": "Attention",
                      "text": "⏰ Benchmark Promotion Reminder"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${reminder_msg}",
                      "wrap": true,
                      "spacing": "Medium"
                    },
                    {
                      "type": "TextBlock",
                      "text": "${urgency_note}",
                      "wrap": true,
                      "spacing": "Small"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "🔒 Private Repo:", "value": "${repo}" },
                        { "title": "📦 Private Version:", "value": "${priv_ver}" },
                        { "title": "🌐 Destination Public Repo:", "value": "${public_repo}" },
                        { "title": "📅 Days Tracked:", "value": "${age_days}" }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "🔗 [View Issue #${number}](${issue_url})",
                      "wrap": true,
                      "spacing": "Medium"
                    }
                  ]
                }
              }
            ]
          }
          EOF
            fi
          done

      - name: Send Teams alert for missing public repo or branch
        if: env.PRIVATE_VERSION != env.PUBLIC_VERSION && env.AGE_DAYS >= 5
        run: |
          repo_short=$(echo "$REPO" | sed 's/^Private-//')
          public_repo="ansible-lockdown/$repo_short"

          missing_reason=""
          if ! gh repo view "$public_repo" > /dev/null 2>&1; then
            missing_reason="🚫 The public repo **$public_repo** does not exist."
          elif ! gh api repos/$public_repo/branches/devel > /dev/null 2>&1; then
            missing_reason="🚫 The \`devel\` branch does not exist in **$public_repo**."
          fi

          if [ -n "$missing_reason" ]; then
          cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @-
          {
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "color": "Attention",
                      "text": "❌ Benchmark Promotion Blocked"
                    },
                    {
                      "type": "TextBlock",
                      "text": "$missing_reason",
                      "wrap": true,
                      "spacing": "Medium"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "🔒 Private Repo", "value": "${REPO}" },
                        { "title": "📦 Private Version", "value": "${PRIVATE_VERSION}" },
                        { "title": "🌐 Public Repo", "value": "$public_repo" }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "📢 Please resolve this to enable promotion.",
                      "wrap": true,
                      "spacing": "Medium"
                    }
                  ]
                }
              }
            ]
          }
          EOF
            exit 0
          fi

      - name: 🚀 Auto-promote benchmarks (age ≥ 5 and not yet promoted)
        run: |
          for issue_file in issue_data/*.json; do
            repo=$(jq -r '.repo' "$issue_file")
            number=$(jq -r '.number' "$issue_file")
            priv_ver=$(jq -r '.priv_ver' "$issue_file")
            pub_ver=$(jq -r '.pub_ver' "$issue_file")
            age_days=$(jq -r '.age_days' "$issue_file")
            public_repo=$(jq -r '.public_repo' "$issue_file")

            if [ "$priv_ver" = "$pub_ver" ] || [ "$age_days" -lt 5 ]; then
              continue
            fi

            echo "Auto-promoting $priv_ver from $repo to $public_repo (Issue #$number)..."

            # Step 1: Prepare promotion workspace
            mkdir -p promote && cd promote

            # Step 2: Clone public repo (devel) and create promotion branch
            git clone --depth 1 --branch devel https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/$public_repo.git public_repo
            cd public_repo
            git checkout -b promote-$priv_ver

            # Step 3: Clone private repo (latest) and sync files
            git clone --depth 1 --branch latest https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/$repo.git ../private_repo
            rsync -av --delete --exclude='.git' ../private_repo/ ./

            # Step 4: Commit and push changes
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "Auto-promoting $priv_ver from $repo"
            git push https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/$public_repo.git promote-$priv_ver

            # Step 5: Create pull request
            gh pr create \
              --repo $public_repo \
              --head promote-$priv_ver \
              --base devel \
              --title "Promote $priv_ver from $repo" \
              --body "Auto-promoted after 95 days."

            # Step 6: Auto-approve PR
            GH_TOKEN=${{ secrets.BADGE_PUSH_TOKEN }} gh pr review promote-$priv_ver --approve --repo $public_repo || echo "Approval failed"

            # Step 7: Merge and cleanup
            GH_TOKEN=${{ secrets.BADGE_PUSH_TOKEN }} gh pr merge promote-$priv_ver \
              --merge \
              --delete-branch \
              --admin \
              --repo $public_repo || echo "Merge failed"

            # Step 8: Cleanup
            cd ../.. && rm -rf promote

            # Step 9: Close private issue
            gh issue close "$number" -R "$repo" --comment "Benchmark version $priv_ver auto-promoted to public on day $age_days."

            # Step 10: Send Teams card
          cat <<EOF | curl -X POST "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @-
          {
            "attachments": [
              {
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "type": "AdaptiveCard",
                  "version": "1.4",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "color": "Good",
                      "text": "✅ Benchmark Auto-Promoted"
                    },
                    {
                      "type": "TextBlock",
                      "text": "🎉 **$priv_ver** from **$repo** was auto-promoted to **$public_repo** after **$age_days** days of tracking.",
                      "wrap": true,
                      "spacing": "Medium"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "🔒 Private Repo", "value": "$repo" },
                        { "title": "📦 Version", "value": "$priv_ver" },
                        { "title": "🌐 Public Repo", "value": "$public_repo" },
                        { "title": "📅 Days Tracked", "value": "$age_days" }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "🧾 PR has been merged, and the issue is closed.",
                      "wrap": true,
                      "spacing": "Medium"
                    }
                  ]
                }
              }
            ]
          }
          EOF

          done
