---
# ----------------------------------------------------------------------
# Export Audit Repo Badges IaC
#
# What this workflow does (high level):
#  1) DISCOVER: Build a list of remediation "base" repos (…-CIS / …-STIG).
#     - Manual run:
#         - If 'repo_name' input is provided → process only that one (basename).
#         - If left blank → auto-discover ALL bases in ansible-lockdown org.
#     - Scheduled run (04:15 UTC daily) → auto-discover ALL bases.
#
#  2) BUILD (Matrix fanout): For each base repo, derive the audit repo (...-Audit)
#     and determine its availability:
#       - Repo exists?
#       - 'latest' branch exists?
#       - 'goss.yml' present in 'latest'?
#     Result:
#       - Available      → brightgreen badge
#       - Not Available  → lightgrey badge
#     Output (per base):
#       output/badges/audit/<Base>-Audit-Badge.json
#
#  3) AGGREGATE: Collect all per-matrix badge artifacts into a single folder.
#
#  4) PUBLISH (single push):
#     - Clone target IaC repo/branch (default: ansible-lockdown/github_windows_IaC@self_hosted)
#     - Rsync badges into target/badges/audit
#     - SAFETY: 'git pull' before push to incorporate remote updates
#     - Commit and push if changes (retry once if a race occurs)
#
# Notes / Collision Safety:
#  - Cron is set to 04:15 UTC to avoid overlap with other 04:00 UTC jobs.
#  - Single publish job commits once (prevents multiple concurrent pushes).
#  - Concurrency group ensures only one run publishes at a time.
# ----------------------------------------------------------------------

name: Export Audit Repo Badges IaC

on:
  schedule:
    - cron: "15 4 * * *"   # Daily at 04:15 UTC
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Optional: public remediation repo (org/name), e.g. ansible-lockdown/Windows-2022-STIG. Leave blank to run for ALL."
        required: false
        default: ""
        type: string
      target_iac_repo:
        description: "Target IaC repo (org/name) that hosts Pages badges"
        required: false
        default: ansible-lockdown/github_windows_IaC
        type: string
      target_branch:
        description: "Target branch to push badges into"
        required: false
        default: self_hosted
        type: string
    secrets:
      BADGE_PUSH_TOKEN:
        required: true

permissions:
  contents: write

concurrency:
  group: export-audit-badges-publish
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.build.outputs.bases }}
    env:
      GH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
    steps:
      - name: Ensure gh CLI is authenticated
        run: gh auth status || gh auth login --with-token <<< "${GH_TOKEN}"

      - name: Build base repo list (CIS/STIG; include Private-, exclude -Audit; add counterparts)
        id: build
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ github.event.inputs.repo_name }}" ]]; then
            # Manual single repo mode (accept org/name or name)
            base="$(basename "${{ github.event.inputs.repo_name }}")"
            base="${base#Private-}"         # strip leading Private-
            printf "%s\n" "$base" > bases_raw.txt
          else
            echo "Auto-discovering bases from org ansible-lockdown …"
            gh repo list ansible-lockdown --json name,isArchived,isFork --limit 1000 \
              | jq -r '
                  .[]
                  | select((.isArchived|not) and (.isFork|not))
                  | .name
                  | select(test("(?i)-(CIS|STIG)"))     # contains -CIS or -STIG
                  | select(test("(?i)-Audit$")|not)     # exclude any -Audit repos
                ' \
              | awk '{sub(/^Private-/, "", $0); print}' \
              | sort -u > bases_raw.txt
          fi

          # Expand counterparts so every base has both CIS and STIG entries
          : > bases.txt
          while IFS= read -r b; do
            [[ -z "$b" ]] && continue
            echo "$b" >> bases.txt
            if [[ "$b" =~ -CIS$ ]]; then
              echo "${b%-CIS}-STIG" >> bases.txt
            elif [[ "$b" =~ -STIG$ ]]; then
              echo "${b%-STIG}-CIS" >> bases.txt
            fi
          done < bases_raw.txt

          sort -u bases.txt -o bases.txt

          echo "Bases to process (with counterparts):"
          cat bases.txt || true

          # Emit as JSON for matrix
          jq -R -s -c 'split("\n") | map(select(length>0))' bases.txt > bases.json
          echo "bases=$(cat bases.json)" >> "$GITHUB_OUTPUT"

  build_badges:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ${{ fromJson(needs.discover.outputs.bases) }}
      fail-fast: false
    env:
      GH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
    steps:
      - name: Create workspace folders
        run: mkdir -p output/badges/audit

      - name: Generate Audit Availability badge JSON
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ matrix.base }}"
          AUDIT="${BASE}-Audit"
          OUT="output/badges/audit/${AUDIT}-Badge.json"

          STATUS="Not Available"
          COLOR="lightgrey"

          if gh repo view "ansible-lockdown/${AUDIT}" >/dev/null 2>&1; then
            if git ls-remote --heads "https://github.com/ansible-lockdown/${AUDIT}.git" latest | grep -q "refs/heads/latest"; then
              rm -rf _audit_repo
              git clone --depth 1 --branch latest "https://x-access-token:${GH_TOKEN}@github.com/ansible-lockdown/${AUDIT}.git" _audit_repo
              if [[ -f "_audit_repo/goss.yml" ]]; then
                STATUS="Available"
                COLOR="brightgreen"
              fi
            fi
          fi

          cat > "$OUT" <<JSON
          { "schemaVersion": 1, "label": "Repo", "message": "${STATUS}", "color": "${COLOR}" }
          JSON

      - name: Upload badge artifact (per base)
        uses: actions/upload-artifact@v4
        with:
          name: audit-badges-${{ matrix.base }}
          path: output/badges/audit/*.json
          if-no-files-found: ignore

  publish:
    needs: build_badges
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
    steps:
      - name: Download all badge artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_badges

      - name: Flatten artifacts → output/badges/audit
        run: |
          mkdir -p output/badges/audit
          find all_badges -type f -name '*.json' -exec cp -f {} output/badges/audit/ \;

      - name: Add .nojekyll
        run: |
          mkdir -p output
          : > output/.nojekyll

      - name: Clone IaC target and stage badges
        run: |
          set -euo pipefail
          target_repo="${{ github.event.inputs.target_iac_repo || 'ansible-lockdown/github_windows_IaC' }}"
          target_branch="${{ github.event.inputs.target_branch || 'self_hosted' }}"

          git config --global user.email "actions@github.com"
          git config --global user.name  "GitHub Actions"

          git clone --branch "${target_branch}" "https://x-access-token:${GH_TOKEN}@github.com/${target_repo}.git" target

          mkdir -p "target/badges/audit"
          rsync -a --checksum "output/badges/audit/" "target/badges/audit/"

      - name: Prune legacy/invalid audit badges
        shell: bash
        run: |
          set -euo pipefail
          cd target
          shopt -s nullglob
          for f in badges/audit/*.json; do
            base="$(basename "$f")"
            if [[ ! "$base" =~ -Audit-Badge\.json$ ]]; then
              echo "Deleting (bad filename): $f"; rm -f "$f"; continue
            fi
            if ! jq -e '.schemaVersion == 1' "$f" >/dev/null 2>&1; then
              echo "Deleting (bad schema): $f"; rm -f "$f"; continue
            fi
            if ! jq -e '.label == "Repo"' "$f" >/dev/null 2>&1; then
              echo "Deleting (legacy label): $f"; rm -f "$f"; continue
            fi
            if ! jq -e '.message == "Available" or .message == "Not Available"' "$f" >/dev/null 2>&1; then
              echo "Deleting (bad message): $f"; rm -f "$f"; continue
            fi
            if ! jq -e '.color == "brightgreen" or .color == "lightgrey"' "$f" >/dev/null 2>&1; then
              echo "Deleting (bad color): $f"; rm -f "$f"; continue
            fi
            echo "Keeping: $f"
          done

      - name: Commit and push to target branch
        run: |
          cd target
          branch="${{ github.event.inputs.target_branch || 'self_hosted' }}"
          git pull --ff-only origin "$branch" || git pull --no-edit origin "$branch" || true
          git add badges/audit
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update AUDIT badges (auto-discovered)"
            git push origin "$branch" || { git pull --no-edit origin "$branch" || true; git push origin "$branch"; }
          fi
