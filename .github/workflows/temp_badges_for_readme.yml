name: Create Temp Badges For Readme (All Repos; CIS/STIG + Private; No Audits)

on:
  schedule:
    - cron: "45 4 * * *"   # daily @ 04:45 UTC
  workflow_dispatch:       # manual runs via Actions UI

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    env:
      ORG: ansible-lockdown
      TARGET_BRANCH: self_hosted
      BADGES_DIR: badges

      # Placeholder labels/messages
      LABEL_PRIVATE: "Private"
      LABEL_MAIN: "Benchmark Version (main)"
      LABEL_DEV: "Benchmark Version (devel)"
      LABEL_RELEASE: "Lockdown Release"

    steps:
      - name: Checkout target (badges) repo/branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Discover repos from GitHub API (all repos; build CIS/STIG + Private targets; exclude audits)
        id: discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Get all repo names in the org (handles pagination)
          gh api --paginate -H "Accept: application/vnd.github+json" "/orgs/${ORG}/repos?per_page=100&type=all" \
            | jq -r '.[].name' \
            | sort -u > all_repos.txt

          # Exclude audits and this repo itself
          grep -Ev '(-Audit$|^github_windows_IaC$)' all_repos.txt > repos_no_audit.txt || true

          # From the API list, keep only names that end with -CIS or -STIG
          # (This makes it OS-agnostic: Windows-2025, Ubuntu-24.04, RHEL-9, etc.)
          awk '
            /^[A-Za-z0-9._-]+-(CIS|STIG)$/ {
              print
            }
          ' repos_no_audit.txt > cis_stig_only.txt

          # Build base names and pair CIS/STIG for each base (even if one side doesn’t exist)
          : > targets.txt
          while IFS= read -r name; do
            # Split "...-CIS" or "...-STIG"
            base=${name%-CIS}
            if [ "$base" = "$name" ]; then
              base=${name%-STIG}
              kind=STIG
            else
              kind=CIS
            fi

            # Normalize base (it’s literally the prefix before -CIS/-STIG)
            # Add both CIS and STIG as targets
            echo "${base}-CIS"  >> targets.txt
            echo "${base}-STIG" >> targets.txt

            # And their Private- counterparts
            echo "Private-${base}-CIS"  >> targets.txt
            echo "Private-${base}-STIG" >> targets.txt
          done < cis_stig_only.txt

          sort -u targets.txt > targets_unique.txt

          echo "Final target list (public + private; CIS/STIG paired; audits excluded):"
          cat targets_unique.txt || true

          echo "TARGET_LIST=$(tr '\n' ' ' < targets_unique.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure git (for committing badges)
        run: |
          git config user.name  "actions-user"
          git config user.email "actions@users.noreply.github.com"

      - name: Seed placeholders (create-only; skip real)
        env:
          TARGET_LIST: ${{ steps.discover.outputs.TARGET_LIST }}
        run: |
          set -euo pipefail
          changed=0

          mk_placeholder() {
            local label="$1"; local message="$2"
            # Shields ignores unknown fields; we tag with "placeholder": true so we never overwrite real ones later
            jq -n --arg lbl "$label" --arg msg "$message" \
              '{schemaVersion:1,label:$lbl,message:$msg,color:"lightgrey",placeholder:true,generatedBy:"seed-from-api@v1"}'
          }

          create_if_missing() {
            local path="$1"; local json="$2"
            if [[ -f "$path" ]]; then
              if grep -qE '"placeholder"[[:space:]]*:[[:space:]]*true' "$path"; then
                echo "Placeholder already present: $path"
              else
                echo "Real badge present (non-placeholder), leaving as-is: $path"
              fi
            else
              echo "Seeding placeholder: $path"
              mkdir -p "$(dirname "$path")"
              printf '%s\n' "$json" > "$path"
              changed=1
            fi
          }

          for name in $TARGET_LIST; do
            # Defensive: skip any audits if they somehow slipped through
            if [[ "$name" =~ -Audit$ ]]; then
              echo "Skip audit: $name"
              continue
            fi

            if [[ "$name" == Private-* ]]; then
              # Private placeholder -> badges/Private-<Base>-<Kind>/benchmark-version.json
              json_priv=$(mk_placeholder "${LABEL_PRIVATE}" "Repo Not Available")
              create_if_missing "${BADGES_DIR}/${name}/benchmark-version.json" "$json_priv"
            else
              # Public placeholders -> badges/<Base>-<Kind>/{benchmark-version-main.json,benchmark-version-devel.json,lockdown-release.json}
              json_main=$(mk_placeholder "${LABEL_MAIN}" "Not Available")
              json_dev=$(mk_placeholder "${LABEL_DEV}" "Not Available")
              json_rel=$(mk_placeholder "${LABEL_RELEASE}" "Not Available")

              create_if_missing "${BADGES_DIR}/${name}/benchmark-version-main.json"  "$json_main"
              create_if_missing "${BADGES_DIR}/${name}/benchmark-version-devel.json" "$json_dev"
              create_if_missing "${BADGES_DIR}/${name}/lockdown-release.json"        "$json_rel"
            fi
          done

          echo "CHANGED=$changed" >> $GITHUB_ENV

      - name: Commit changes (if any)
        if: env.CHANGED == '1'
        run: |
          git add $BADGES_DIR
          git commit -m "seed(api): placeholders for all CIS/STIG repos + Private (create-only, audits excluded)"
          git push origin "${TARGET_BRANCH}"
