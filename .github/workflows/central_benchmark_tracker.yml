---

# Central Benchmark Tracker Workflow
# Handles:
# 1. 'benchmark-tracker': Starts 90-day tracking when PR from benchmark_ is merged in a Private repo.
# 2. 'monitor-90day-promotions': Checks issue age daily and promotes after 90+ days.

name: Central Benchmark Tracker

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      merged_branch:
        required: false
        type: string
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  benchmark-tracker:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'latest' && startsWith(github.repository, 'ansible-lockdown/Private-'))
    name: Track New Benchmark Promotion
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "TEAMS_WEBHOOK_URL is not set."
            exit 1
          fi

      - name: Validate calling repository is Private
        if: ${{ !startsWith(inputs.repo_name, 'ansible-lockdown/Private-') }}
        run: |
          echo "This workflow must be called by ansible-lockdown/Private-* repos."
          exit 1

      - name: Extract short repo name and public repo equivalent
        id: names
        run: |
          repo_full="${{ inputs.repo_name }}"
          repo_short=$(basename "$repo_full")
          public_name=$(echo "$repo_short" | sed 's/^Private-//')
          echo "repo_short=$repo_short" >> $GITHUB_OUTPUT
          echo "public_repo=ansible-lockdown/$public_name" >> $GITHUB_OUTPUT

      - name: Clone private repo to extract benchmark version
        run: |
          echo "Cloning latest branch of ${{ inputs.repo_name }} to extract version..."
          git clone --depth 1 --branch latest https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/${{ inputs.repo_name }}.git privaterepo

          if [ ! -f privaterepo/README.md ]; then
            echo "README.md not found in latest branch of ${{ inputs.repo_name }}"
            version="Unknown"
          else
            cd privaterepo
            version=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1)
            if [ -z "$version" ]; then
              version=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' README.md | head -n1)
            fi
            if [ -z "$version" ]; then
              echo "Unable to determine version from README.md"
              exit 1
            fi
          fi

          echo "Extracted version: $version"
          echo "version=$version" >> $GITHUB_ENV

      - name: Check version in public devel branch
        run: |
          echo "Cloning devel branch of ${{ steps.names.outputs.public_repo }} to extract version..."
          if ! git clone --depth 1 --branch devel https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/${{ steps.names.outputs.public_repo }}.git publicrepo 2>/dev/null; then
            echo "Public repo does not exist or cannot be cloned."
            pub_ver="__MISSING__"
          elif [ ! -f publicrepo/README.md ]; then
            echo "README.md missing in public repo."
            pub_ver="__MISSING__"
          else
            cd publicrepo
            pub_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1)
            if [ -z "$pub_ver" ]; then
              pub_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' README.md | head -n1)
            fi
            if [ -z "$pub_ver" ]; then
              echo "Unable to determine version from README.md"
              exit 1
            fi
          fi

          echo "Extracted public version: $pub_ver"
          echo "public_version=$pub_ver" >> $GITHUB_ENV

      - name: Decide if tracking is needed
        id: version-check
        run: |
          if [ "$version" = "$public_version" ]; then
            echo "No tracking needed: $version is already in public repo."
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "Tracking needed: $version is not yet in public repo."
            echo "needed=true" >> $GITHUB_OUTPUT

      - name: Create tracking issue in Private repo
        if: steps.version-check.outputs.needed == 'true'
        run: |
          title="Track promotion of $version to public"
          existing=$(gh issue list -R ${{ inputs.repo_name }} --state all --search "$title" --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "Issue already exists: #$existing"
            exit 0
          fi

          gh issue create \
            --repo ${{ inputs.repo_name }} \
            --title "$title" \
            --body "This issue tracks promotion of version $version from Private to public.\n\nDue: 90 days from now." \
            --label benchmark-90day

      - name: Send Teams notification about tracking start
        if: steps.version-check.outputs.needed == 'true' && env.public_version != '__MISSING__'
        run: |
          curl -X POST -H 'Content-Type: application/json' -d "{
            \"type\": \"message\",
            \"attachments\": [{
              \"contentType\": \"application/vnd.microsoft.card.adaptive\",
              \"content\": {
                \"type\": \"AdaptiveCard\",
                \"version\": \"1.4\",
                \"body\": [
                  { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"Benchmark Tracking Started\" },
                  { \"type\": \"TextBlock\", \"text\": \"Tracking started for $version in ${{ inputs.repo_name }}.\\nExpected promotion to public repo: ${{ steps.names.outputs.public_repo }} in 90 days.\", \"wrap\": true }
                ],
                \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
              }
            }]
          }" ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Send Teams alert if public repo is missing
        if: steps.version-check.outputs.needed == 'true' && env.public_version == '__MISSING__'
        run: |
          curl -X POST -H 'Content-Type: application/json' -d "{
            \"type\": \"message\",
            \"attachments\": [{
              \"contentType\": \"application/vnd.microsoft.card.adaptive\",
              \"content\": {
                \"type\": \"AdaptiveCard\",
                \"version\": \"1.4\",
                \"body\": [
                  { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"color\": \"Attention\", \"text\": \"Public Repo Not Ready\" },
                  { \"type\": \"TextBlock\", \"text\": \"A benchmark version $version was pushed to ${{ inputs.repo_name }} but the corresponding public repo ${{ steps.names.outputs.public_repo }} is not yet available or lacks a devel branch with a README.\", \"wrap\": true },
                  { \"type\": \"TextBlock\", \"text\": \"Please ensure the public repo is created and initialized so promotion can occur in 90 days.\", \"wrap\": true }
                ],
                \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
              }
            }]
                }" ${{ secrets.TEAMS_WEBHOOK_URL }}

  monitor-90day-promotions:
    name: Monitor & Auto-Promote Benchmarks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "TEAMS_WEBHOOK_URL is not set."
            exit 1
          fi

      # Install GitHub CLI so we can query issues and create/merge PRs
      - name: Install GitHub CLI
        run: |
          sudo apt-get update && sudo apt-get install -y gh

      # Set the repository to monitor (the one that triggered this scheduled workflow)
      - name: Define repos to monitor
        run: |
          echo "PRIVATE_REPOS=${{ github.repository }}" >> $GITHUB_ENV

      # Loop through each issue in the repo that is being tracked
      - name: Loop through repos and process issues
        run: |
          for repo in $PRIVATE_REPOS; do
            echo "Checking issues in $repo"

            # Get all open issues labeled 'benchmark-90day'
            gh issue list -R ansible-lockdown/$repo --label benchmark-90day --state open --json title,number,createdAt --jq '.[]' > issues.json

            # Process each issue individually
            jq -c '.' issues.json | while read -r issue; do
              # Extract issue metadata
              title=$(echo "$issue" | jq -r '.title')
              number=$(echo "$issue" | jq -r '.number')
              created_at=$(echo "$issue" | jq -r '.createdAt')

              # Calculate age of issue in days
              age_days=$(( ( $(date +%s) - $(date -d "$created_at" +%s) ) / 86400 ))
              echo "Issue #$number ($title) is $age_days days old."

              # Get the corresponding public repo name
              repo_short=$(echo "$repo" | sed 's/^Private-//')
              public_repo="ansible-lockdown/$repo_short"

              # Prepare temp directory for version comparison
              rm -rf tmpclone && mkdir -p tmpclone && cd tmpclone

              # Clone private repo to get current benchmark version
              git clone --depth 1 --branch latest https://github.com/ansible-lockdown/$repo.git private
              priv_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' private/README.md | head -n1)
              [ -z "$priv_ver" ] && priv_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' private/README.md | head -n1)

              # Early skip if version could not be found
              if [ -z "$priv_ver" ]; then
                echo "[WARN] No version found in private repo $repo. Skipping issue #$number."
                cd .. && rm -rf tmpclone
                continue
              fi

              # Clone public repo to get current version in 'devel'
              git clone --depth 1 --branch devel https://github.com/$public_repo.git public
              pub_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' public/README.md | head -n1)
              [ -z "$pub_ver" ] && pub_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' public/README.md | head -n1)

              cd .. && rm -rf tmpclone

              # If version already promoted, close the issue and send Teams notification
              if [ "$priv_ver" = "$pub_ver" ]; then
                echo "[INFO] Benchmark version $priv_ver already promoted. Closing issue #$number."

                gh issue close $number -R ansible-lockdown/$repo --comment "Benchmark version $priv_ver has been promoted to public. Closing tracker."

                promoted_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
                issue_url="https://github.com/ansible-lockdown/$repo/issues/$number"

                # Send reminder message to Teams
                echo "Sending Teams closing message for issue #$number."
                curl -X POST -H 'Content-Type: application/json' -d "{
                  \"type\": \"message\",
                  \"attachments\": [
                    {
                      \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                      \"content\": {
                        \"type\": \"AdaptiveCard\",
                        \"version\": \"1.4\",
                        \"body\": [
                          { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"Benchmark Already Promoted\" },
                          { \"type\": \"TextBlock\", \"text\": \"Benchmark version $priv_ver from $repo is already present in $public_repo.\", \"wrap\": true },
                          { \"type\": \"TextBlock\", \"text\": \"Issue #$number has been closed.\", \"wrap\": true },
                          { \"type\": \"TextBlock\", \"text\": \"[View Issue #$number]($issue_url)\", \"wrap\": true },
                          { \"type\": \"TextBlock\", \"spacing\": \"Medium\", \"text\": \"Promoted previously on: $promoted_time\", \"wrap\": true }
                        ],
                        \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
                      }
                    }
                  ]
                }" ${{ secrets.TEAMS_WEBHOOK_URL }}
                continue
              fi

              # If day 85-94: Send reminder card to Teams
              if [ "$age_days" -ge 85 ] && [ "$age_days" -lt 95 ]; then
                if [ $age_days -eq 90 ]; then
                  reminder_msg="Benchmark $priv_ver from $repo is due for public release **today** (day 90)."
                elif [ $age_days -lt 90 ]; then
                  days_left=$((90 - age_days))
                  reminder_msg="Benchmark $priv_ver from $repo is due for public release in **$days_left day(s)** (target: day 90)."
                else
                  overdue_days=$((age_days - 90))
                  merge_in_days=$((95 - age_days))
                  reminder_msg="Benchmark $priv_ver from $repo is **overdue by $overdue_days day(s)**.\nIt will be auto-promoted in **$merge_in_days day(s)** (at day 95)."
                fi

                issue_url="https://github.com/ansible-lockdown/$repo/issues/$number"

                # Send reminder message to Teams
                echo "Sending Teams reminder for issue #$number: $reminder_msg"
                curl -X POST -H 'Content-Type: application/json' -d "{
                  \"type\": \"message\",
                  \"attachments\": [
                    {
                      \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                      \"content\": {
                        \"type\": \"AdaptiveCard\",
                        \"version\": \"1.4\",
                        \"body\": [
                          { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"Benchmark Reminder\" },
                          { \"type\": \"TextBlock\", \"text\": \"$reminder_msg\", \"wrap\": true }
                        ],
                        \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
                      }
                    }
                  ]
                }" ${{ secrets.TEAMS_WEBHOOK_URL }}
                continue
              fi

              # If day 95+: Auto-promote to public repo
              if [ $age_days -ge 95 ]; then
                echo "Checking if public repo and devel branch exist for $public_repo"

                # Check if public repo exists
                if ! gh repo view $public_repo > /dev/null 2>&1; then
                  echo "Public repo $public_repo does not exist. Sending Teams alert."
                  curl -X POST -H 'Content-Type: application/json' -d "{
                    \"type\": \"message\",
                    \"attachments\": [
                      {
                        \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                        \"content\": {
                          \"type\": \"AdaptiveCard\",
                          \"version\": \"1.4\",
                          \"body\": [
                            { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"Promotion Blocked: Missing Public Repo\" },
                            { \"type\": \"TextBlock\", \"text\": \"Public repository *$public_repo* does not exist. Unable to auto-promote benchmark $priv_ver from $repo.\", \"wrap\": true }
                          ],
                          \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
                        }
                      }
                    ]
                  }" ${{ secrets.TEAMS_WEBHOOK_URL }}
                  continue
                fi

                # Check if public repo has a devel branch
                if ! gh api repos/$public_repo/branches/devel > /dev/null 2>&1; then
                  echo "Devel branch missing in $public_repo. Sending Teams alert."
                  curl -X POST -H 'Content-Type: application/json' -d "{
                    \"type\": \"message\",
                    \"attachments\": [
                      {
                        \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                        \"content\": {
                          \"type\": \"AdaptiveCard\",
                          \"version\": \"1.4\",
                          \"body\": [
                            { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"Promotion Blocked: Missing Devel Branch\" },
                            { \"type\": \"TextBlock\", \"text\": \"Public repo *$public_repo* does not have a *devel* branch. Unable to promote benchmark $priv_ver from $repo.\", \"wrap\": true }
                          ],
                          \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
                        }
                      }
                    ]
                  }" ${{ secrets.TEAMS_WEBHOOK_URL }}
                  continue
                fi

                echo "Auto-promoting $priv_ver from $repo to $public_repo"

                # Create working directory and clone public repo
                mkdir -p promote && cd promote
                git clone --depth 1 --branch devel https://github.com/$public_repo.git public_repo
                cd public_repo
                git checkout -b promote-$priv_ver

                # Clone private repo and copy files over (without git history)
                git clone --depth 1 --branch latest https://github.com/ansible-lockdown/$repo.git ../private_repo
                rsync -av --delete --exclude='.git' ../private_repo/ ./

                # Commit and push changes to public repo
                git config user.name "github-actions"
                git config user.email "actions@github.com"
                git add .
                git commit -m "Auto-promoting $priv_ver from $repo"
                git push origin promote-$priv_ver

                # Open and auto-merge the PR to devel
                gh pr create \
                  --repo $public_repo \
                  --head promote-$priv_ver \
                  --base devel \
                  --title "Promote $priv_ver from $repo" \
                  --body "Auto-promoted after 95 days."
                gh pr merge promote-$priv_ver --squash --delete-branch --repo $public_repo

                # Clean up workspace
                cd ../.. && rm -rf promote

                # Close issue in private repo and notify Teams
                gh issue close $number -R ansible-lockdown/$repo --comment "Benchmark version $priv_ver auto-promoted to public on day $age_days."

                curl -X POST -H 'Content-Type: application/json' -d "{
                  \"type\": \"message\",
                  \"attachments\": [
                    {
                      \"contentType\": \"application/vnd.microsoft.card.adaptive\",
                      \"content\": {
                        \"type\": \"AdaptiveCard\",
                        \"version\": \"1.4\",
                        \"body\": [
                          { \"type\": \"TextBlock\", \"size\": \"Large\", \"weight\": \"Bolder\", \"text\": \"Benchmark Auto-Promoted\" },
                          { \"type\": \"TextBlock\", \"text\": \"Benchmark $priv_ver from $repo has been automatically promoted after $age_days days.\", \"wrap\": true }
                        ],
                        \"$schema\": \"http://adaptivecards.io/schemas/adaptive-card.json\"
                      }
                    }
                  ]
                }" ${{ secrets.TEAMS_WEBHOOK_URL }}
              fi
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
