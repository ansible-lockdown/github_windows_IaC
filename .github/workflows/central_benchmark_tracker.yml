---

# Central Benchmark Tracker Workflow
# Handles:
# 1. 'benchmark-tracker': Starts 90-day tracking when PR from benchmark_ is merged in a Private repo.
# 2. 'monitor-90day-promotions': Checks issue age daily and promotes after 90+ days.

name: Central Benchmark Tracker

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
      merged_branch:
        required: false
        type: string
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true
      BADGE_PUSH_TOKEN:
        required: true

jobs:
  benchmark-tracker:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'latest' && startsWith(github.repository, 'ansible-lockdown/Private-'))
    name: Track New Benchmark Promotion
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
            echo "TEAMS_WEBHOOK_URL is not set."
            exit 1
          fi

      - name: Validate calling repository is Private
        if: ${{ !startsWith(inputs.repo_name, 'ansible-lockdown/Private-') }}
        run: |
          echo "This workflow must be called by ansible-lockdown/Private-* repos."
          exit 1

      - name: Extract short repo name and public repo equivalent
        id: names
        run: |
          repo_full="${{ inputs.repo_name }}"
          repo_short=$(basename "$repo_full")
          public_name=$(echo "$repo_short" | sed 's/^Private-//')
          echo "repo_short=$repo_short" >> $GITHUB_OUTPUT
          echo "public_repo=ansible-lockdown/$public_name" >> $GITHUB_OUTPUT

      - name: Clone private repo to extract benchmark version
        id: version-check
        run: |
          echo "Cloning latest branch of ${{ inputs.repo_name }} to extract version..."
          git clone --depth 1 --branch latest https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/${{ inputs.repo_name }}.git privaterepo

          if [ ! -f privaterepo/README.md ]; then
            echo "README.md not found in latest branch of ${{ inputs.repo_name }}"
            version="Unknown"
          else
            cd privaterepo
            version=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1)
            if [ -z "$version" ]; then
              version=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' README.md | head -n1)
            fi
            if [ -z "$version" ]; then
              echo "Unable to determine version from README.md"
              exit 1
            fi
          fi

          echo "Extracted version: $version"
          echo "version=$version" >> $GITHUB_ENV
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check version in public devel branch
        id: public-check
        run: |
          echo "Cloning devel branch of ${{ steps.names.outputs.public_repo }} to extract version..."
          if ! git clone --depth 1 --branch devel https://x-access-token:${{ secrets.BADGE_PUSH_TOKEN }}@github.com/${{ steps.names.outputs.public_repo }}.git publicrepo 2>/dev/null; then
            echo "Public repo does not exist or cannot be cloned."
            pub_ver="__MISSING__"
          elif [ ! -f publicrepo/README.md ]; then
            echo "README.md missing in public repo."
            pub_ver="__MISSING__"
          else
            cd publicrepo
            pub_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' README.md | head -n1)
            if [ -z "$pub_ver" ]; then
              pub_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' README.md | head -n1)
            fi
            if [ -z "$pub_ver" ]; then
              echo "Unable to determine version from README.md"
              exit 1
            fi
          fi

          echo "Extracted public version: $pub_ver"
          echo "public_version=$pub_ver" >> $GITHUB_ENV
          echo "public_version=$pub_ver" >> $GITHUB_OUTPUT

      - name: Decide if tracking is needed
        id: tracking-needed
        run: |
          if [ "${{ steps.version-check.outputs.version }}" = "${{ steps.public-check.outputs.public_version }}" ]; then
            echo "No tracking needed: version already in public repo."
            echo "needed=false" >> $GITHUB_OUTPUT
          else
            echo "Tracking needed: version is not yet in public repo."
            echo "needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Ensure benchmark-3day label exists
        id: ensure-label
        run: |
          if ! gh label list -R ${{ inputs.repo_name }} | grep -q '^benchmark-3day'; then
            echo "Creating missing label: benchmark-3day"
            gh label create benchmark-3day \
              --color FFA500 \
              --description "Tracks 3-day benchmark promotion" \
              -R ${{ inputs.repo_name }}
          else
            echo "Label benchmark-3day already exists"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tracking issue in Private repo
        if: steps.tracking-needed.outputs.needed == 'true'
        env:
          version: ${{ steps.version-check.outputs.version }}
        run: |
          title="Track promotion of $version to public"
          existing=$(gh issue list -R ${{ inputs.repo_name }} --state all --search "$title" --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "Issue already exists: #$existing"
            exit 0
          fi

          gh issue create \
            --repo ${{ inputs.repo_name }} \
            --title "$title" \
            --body "This issue tracks promotion of version $version from Private to public.\n\nDue: 3 days from now." \
            --label benchmark-3day

      - name: Debug Webhook Value
        run: |
          echo "::warning ::Webhook starts with: ${TEAMS_WEBHOOK_URL:0:20}..."
          echo "TEAMS_WEBHOOK_URL length: ${#TEAMS_WEBHOOK_URL}"
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Send Teams alert if public repo is missing
        if: steps.tracking-needed.outputs.needed == 'true' && steps.public-check.outputs.public_version == '__MISSING__'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          version: ${{ steps.version-check.outputs.version }}
          repo_name: ${{ inputs.repo_name }}
          public_repo: ${{ steps.names.outputs.public_repo }}
        run: |
          echo "::debug ::Webhook starts with: ${TEAMS_WEBHOOK_URL:0:20}..."
          echo "::debug ::Repo Name: ${repo_name}"
          echo "::debug ::Version: ${version}"
          curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {
                    "type": "TextBlock",
                    "size": "Large",
                    "weight": "Bolder",
                    "color": "Attention",
                    "text": "🚫 Public Repo Not Ready"
                  },
                  {
                    "type": "TextBlock",
                    "text": "🔍 A benchmark version '${version}' was pushed to **${repo_name}**, but the corresponding public repo **${public_repo}** is missing or lacks a devel branch with a README.md.",
                    "wrap": true,
                    "spacing": "Medium"
                  },
                  {
                    "type": "TextBlock",
                    "text": "📢 Please ensure the public repository is created and initialized so tracking and promotion can continue smoothly.",
                    "wrap": true,
                    "spacing": "Medium"
                  }
                ]
              }
            }]
          }
          EOF

      - name: Send Teams notification about tracking start
        if: steps.tracking-needed.outputs.needed == 'true' && steps.public-check.outputs.public_version != '__MISSING__'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          version: ${{ steps.version-check.outputs.version }}
          public_version: ${{ steps.public-check.outputs.public_version }}
          repo_name: ${{ inputs.repo_name }}
          public_repo: ${{ steps.names.outputs.public_repo }}
        run: |
          echo "::debug ::Webhook starts with: ${TEAMS_WEBHOOK_URL:0:20}..."
          echo "::debug ::Repo Name: ${repo_name}"
          echo "::debug ::Version: ${version}"
          curl -X POST "$TEAMS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @- <<EOF
          {
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {
                    "type": "TextBlock",
                    "size": "Large",
                    "weight": "Bolder",
                    "text": "🚀 Tracking initiated"
                  },
                  {
                    "type": "TextBlock",
                    "size": "Large",
                    "weight": "Bolder",
                    "wrap": true,
                    "text": "${repo_name} has entered the promotion queue."
                  },
                  {
                    "type": "TextBlock",
                    "text": "The ${version} release has entered its 3-day review window and is now being tracked for public publication.",
                    "wrap": true,
                    "spacing": "Medium"
                  },
                  {
                    "type": "FactSet",
                    "facts": [
                      { "title": "🔒 Private Repo:", "value": "${repo_name}" },
                      { "title": "📦 Private Version:", "value": "${version}" },
                      { "title": " ", "value": " " },
                      { "title": "🌐 Public Target:", "value": "${public_repo}" },
                      { "title": "📦 Public Version:", "value": "${public_version}" },
                      { "title": " ", "value": " " },
                      { "title": "📅 Promotion In:", "value": "90 days" }
                    ]
                  },
                  {
                    "type": "TextBlock",
                    "text": "⏳ Please ensure the public repo is ready for promotion.",
                    "wrap": true,
                    "spacing": "Medium"
                  }
                ]
              }
            }]
          }
          EOF

monitor-90day-promotions:
  name: Monitor & Auto-Promote Benchmarks
  runs-on: ubuntu-latest
  env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
  steps:
    - name: Validate required secrets
      run: |
        if [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ]; then
          echo "TEAMS_WEBHOOK_URL is not set."
          exit 1
        fi

    - name: Install GitHub CLI
      run: |
        sudo apt-get update && sudo apt-get install -y gh

    - name: Define repos to monitor
      run: |
        echo "PRIVATE_REPOS=${{ github.repository }}" >> $GITHUB_ENV

    - name: Loop through repos and process issues
      run: |
        for repo in $PRIVATE_REPOS; do
          echo "Checking issues in $repo"

          gh issue list -R ansible-lockdown/$repo --label benchmark-3day --state open --json title,number,createdAt --jq '.[]' > issues.json

          jq -c '.' issues.json | while read -r issue; do
            title=$(echo "$issue" | jq -r '.title')
            number=$(echo "$issue" | jq -r '.number')
            created_at=$(echo "$issue" | jq -r '.createdAt')

            age_days=$(( ( $(date +%s) - $(date -d "$created_at" +%s) ) / 86400 ))
            echo "Issue #$number ($title) is $age_days days old."

            repo_short=$(echo "$repo" | sed 's/^Private-//')
            public_repo="ansible-lockdown/$repo_short"

            rm -rf tmpclone && mkdir -p tmpclone && cd tmpclone

            git clone --depth 1 --branch latest https://github.com/ansible-lockdown/$repo.git private
            priv_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' private/README.md | head -n1)
            [ -z "$priv_ver" ] && priv_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' private/README.md | head -n1)

            if [ -z "$priv_ver" ]; then
              echo "[WARN] No version found in private repo $repo. Skipping issue #$number."
              cd .. && rm -rf tmpclone
              continue
            fi

            git clone --depth 1 --branch devel https://github.com/$public_repo.git public
            pub_ver=$(grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' public/README.md | head -n1)
            [ -z "$pub_ver" ] && pub_ver=$(grep -Eo 'Version [0-9]+, Rel [0-9]+' public/README.md | head -n1)

            cd .. && rm -rf tmpclone

            if [ "$priv_ver" = "$pub_ver" ]; then
              echo "[INFO] Benchmark version $priv_ver already promoted. Closing issue #$number."
              gh issue close $number -R ansible-lockdown/$repo --comment "Benchmark version $priv_ver has been promoted to public. Closing tracker."

              promoted_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              issue_url="https://github.com/ansible-lockdown/$repo/issues/$number"

              echo "Sending Teams closing message for issue #$number."
              cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d @-
              {
                "attachments": [
                  {
                    "contentType": "application/vnd.microsoft.card.adaptive",
                    "content": {
                      "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                        {
                          "type": "TextBlock",
                          "size": "Large",
                          "weight": "Bolder",
                          "color": "Good",
                          "text": "✅ Benchmark Already Promoted"
                        },
                        {
                          "type": "TextBlock",
                          "text": "Benchmark version ${priv_ver} from **${repo}** is already available in **${public_repo}**.",
                          "wrap": true,
                          "spacing": "Medium"
                        },
                        {
                          "type": "FactSet",
                          "facts": [
                            { "title": "🔒 Private Repo:", "value": "${repo}" },
                            { "title": "📦 Private Version:", "value": "${priv_ver}" },
                            { "title": "🌐 Public Repo:", "value": "${public_repo}" },
                            { "title": "📦 Public Version:", "value": "${pub_ver}" }
                          ]
                        },
                        {
                          "type": "TextBlock",
                          "text": "🔗 [View Issue #${number}](${issue_url})",
                          "wrap": true,
                          "spacing": "Medium"
                        },
                        {
                          "type": "TextBlock",
                          "text": "📅 Promoted on: ${promoted_time}",
                          "wrap": true,
                          "spacing": "Small"
                        }
                      ]
                    }
                  }
                ]
              }
              EOF
              continue
            fi

            if [ "$age_days" -ge 2 ] && [ "$age_days" -lt 5 ]; then
              if [ "$age_days" -eq 3 ]; then
                reminder_msg="🚨 **Benchmark $priv_ver** from \`$repo\` is due for public release **today** (day 3)."
                urgency_note="⌛ Please review and promote if everything is ready."
              elif [ "$age_days" -lt 3 ]; then
                days_left=$((3 - age_days))
                reminder_msg="⏳ **Benchmark $priv_ver** from \`$repo\` is due for public release in **$days_left day(s)**."
                urgency_note="🎯 Target date is day 3. Prepare for promotion."
              else
                overdue_days=$((age_days - 3))
                merge_in_days=$((5 - age_days))
                reminder_msg="⚠️ **Benchmark $priv_ver** from \`$repo\` is **overdue by $overdue_days day(s)**."
                urgency_note="⏲️ Auto-promotion will occur in **$merge_in_days day(s)** (day 5)."
              fi

              issue_url="https://github.com/ansible-lockdown/$repo/issues/$number"

              echo "Sending Teams reminder for issue #$number"
              cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
                -H "Content-Type: application/json" \
                -d @-
              {
                "attachments": [
                  {
                    "contentType": "application/vnd.microsoft.card.adaptive",
                    "content": {
                      "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      "type": "AdaptiveCard",
                      "version": "1.4",
                      "body": [
                        {
                          "type": "TextBlock",
                          "size": "Large",
                          "weight": "Bolder",
                          "color": "Attention",
                          "text": "⏰ Benchmark Promotion Reminder"
                        },
                        {
                          "type": "TextBlock",
                          "text": "${reminder_msg}",
                          "wrap": true,
                          "spacing": "Medium"
                        },
                        {
                          "type": "TextBlock",
                          "text": "${urgency_note}",
                          "wrap": true,
                          "spacing": "Small"
                        },
                        {
                          "type": "FactSet",
                          "facts": [
                            { "title": "🔒 Private Repo:", "value": "${repo}" },
                            { "title": "📦 Private Version:", "value": "${priv_ver}" },
                            { "title": "🌐 Destination Public Repo:", "value": "${public_repo}" },
                            { "title": "📅 Days Tracked:", "value": "${age_days}" }
                          ]
                        },
                        {
                          "type": "TextBlock",
                          "text": "🔗 [View Issue #${number}](${issue_url})",
                          "wrap": true,
                          "spacing": "Medium"
                        }
                      ]
                    }
                  }
                ]
              }
              EOF
              continue
            fi

              # If day 95+: Auto-promote to public repo
                if [ "$age_days" -ge 5 ]; then
                echo "Checking if public repo and devel branch exist for $public_repo"

                # Check if public repo exists
                if ! gh repo view "$public_repo" > /dev/null 2>&1; then
                  echo "Public repo $public_repo does not exist. Sending Teams alert."

                  cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -d @-
                  {
                    "attachments": [
                      {
                        "contentType": "application/vnd.microsoft.card.adaptive",
                        "content": {
                          "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.4",
                          "body": [
                            {
                              "type": "TextBlock",
                              "size": "Large",
                              "weight": "Bolder",
                              "color": "Attention",
                              "text": "🚫 Promotion Blocked: Missing Public Repository"
                            },
                            {
                              "type": "TextBlock",
                              "text": "❌ The public repository **${public_repo}** does not exist. Unable to promote benchmark **${priv_ver}** from **${repo}**.",
                              "wrap": true,
                              "spacing": "Medium"
                            },
                            {
                              "type": "FactSet",
                              "facts": [
                                { "title": "🔒 Private Repo:", "value": "${repo}" },
                                { "title": "📦 Version:", "value": "${priv_ver}" },
                                { "title": "🌐 Missing Repo:", "value": "${public_repo}" }
                              ]
                            },
                            {
                              "type": "TextBlock",
                              "text": "📢 Please create the public repository to enable automatic promotion.",
                              "wrap": true,
                              "spacing": "Medium"
                            }
                          ]
                        }
                      }
                    ]
                  }
                  EOF

                  continue
                fi

                # Check if public repo has a devel branch
                if ! gh api repos/$public_repo/branches/devel > /dev/null 2>&1; then
                  echo "Devel branch missing in $public_repo. Sending Teams alert."

                  cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
                    -H "Content-Type: application/json" \
                    -d @-
                  {
                    "attachments": [
                      {
                        "contentType": "application/vnd.microsoft.card.adaptive",
                        "content": {
                          "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                          "type": "AdaptiveCard",
                          "version": "1.4",
                          "body": [
                            {
                              "type": "TextBlock",
                              "size": "Large",
                              "weight": "Bolder",
                              "color": "Attention",
                              "text": "🚫 Promotion Blocked: Missing 'devel' Branch"
                            },
                            {
                              "type": "TextBlock",
                              "text": "⚠️ The public repo **${public_repo}** does not have a **\`devel\`** branch. Benchmark **${priv_ver}** from **${repo}** cannot be promoted.",
                              "wrap": true,
                              "spacing": "Medium"
                            },
                            {
                              "type": "FactSet",
                              "facts": [
                                { "title": "🔒 Private Repo:", "value": "${repo}" },
                                { "title": "📦 Version:", "value": "${priv_ver}" },
                                { "title": "🌐 Public Repo:", "value": "${public_repo}" }
                              ]
                            },
                            {
                              "type": "TextBlock",
                              "text": "📢 Please create a \`devel\` branch in the public repository with an initial README to proceed.",
                              "wrap": true,
                              "spacing": "Medium"
                            }
                          ]
                        }
                      }
                    ]
                  }
                  EOF

                  continue
                fi

                # ✅ All checks passed — proceed to promotion
                echo "Auto-promoting $priv_ver from $repo to $public_repo"

                mkdir -p promote && cd promote
                git clone --depth 1 --branch devel https://github.com/$public_repo.git public_repo
                cd public_repo
                git checkout -b promote-$priv_ver

                git clone --depth 1 --branch latest https://github.com/ansible-lockdown/$repo.git ../private_repo
                rsync -av --delete --exclude='.git' ../private_repo/ ./

                git config user.name "github-actions"
                git config user.email "actions@github.com"
                git add .
                git commit -m "Auto-promoting $priv_ver from $repo"
                git push origin promote-$priv_ver

                # Create PR
                gh pr create \
                  --repo $public_repo \
                  --head promote-$priv_ver \
                  --base devel \
                  --title "Promote $priv_ver from $repo" \
                  --body "Auto-promoted after 95 days."

                # Auto-approve the PR
                gh pr review promote-$priv_ver --approve --repo $public_repo || echo "Approval failed (token may lack permission)"

                # Attempt standard merge (merge commit, not squash)
                gh pr merge promote-$priv_ver \
                  --merge \
                  --delete-branch \
                  --admin \
                  --repo $public_repo || echo "Merge failed — likely due to protections or unmet checks"

                cd ../.. && rm -rf promote

                gh issue close $number -R ansible-lockdown/$repo --comment "Benchmark version $priv_ver auto-promoted to public on day $age_days."

                cat <<EOF | curl -X POST "$TEAMS_WEBHOOK_URL" \
                  -H "Content-Type: application/json" \
                  -d @-
                {
                  "attachments": [
                    {
                      "contentType": "application/vnd.microsoft.card.adaptive",
                      "content": {
                        "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                        "type": "AdaptiveCard",
                        "version": "1.4",
                        "body": [
                          {
                            "type": "TextBlock",
                            "size": "Large",
                            "weight": "Bolder",
                            "color": "Good",
                            "text": "✅ Benchmark Auto-Promoted"
                          },
                          {
                            "type": "TextBlock",
                            "text": "🎉 Benchmark version ${priv_ver} from **${repo}** has been automatically promoted to **${public_repo}** after **${age_days}** days of tracking.",
                            "wrap": true,
                            "spacing": "Medium"
                          },
                          {
                            "type": "FactSet",
                            "facts": [
                              { "title": "🔒 Private Repo:", "value": "${repo}" },
                              { "title": "📦 Version:", "value": "${priv_ver}" },
                              { "title": "🌐 Public Repo:", "value": "${public_repo}" },
                              { "title": "📅 Days Tracked:", "value": "${age_days}" }
                            ]
                          },
                          {
                            "type": "TextBlock",
                            "text": "🧾 Pull request has been merged and the issue closed.",
                            "wrap": true,
                            "spacing": "Medium"
                          }
                        ]
                      }
                    }
                  ]
                }
                EOF

              fi
